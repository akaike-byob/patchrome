name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm pack --dry-run

  integration:
    name: Integration tests
    # The tests drive a headed Chrome, and patchrome supports macOS only; GitHub's macOS runners ship Chrome.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Loop the restart tests until one fails
        run: |
          set +e
          mkdir -p failure
          for i in $(seq 1 15); do
            if npx vitest run test/integration/hardening.test.ts > "run-$i.txt" 2>&1; then
              echo "=== run $i passed"; rm -rf "$TMPDIR"/patchrome-*
            else
              echo "=== run $i failed"; grep -E "FAIL" "run-$i.txt"
              cp "run-$i.txt" failure/; cp -R "$TMPDIR"/patchrome-hardening-* failure/ 2>/dev/null
              find failure -name "Singleton*" -delete; rm -rf failure/*/stealth/chrome-profile
              exit 1
            fi
          done
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restart-failure
          path: failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for organization repos; the container does not.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -v
