name: Probe focus

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Probe focus (${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: |
          for i in 1 2 3 4 5 6; do
            echo "=== attempt $i"
            DEBUG=pw:api,pw:protocol npx vitest run test/integration/wait-watch.test.ts -t "interstitial" > vitest.log 2>&1 || true
            grep -E "×|✓ .*interstitial|expected" vitest.log || true
            for log in "$TMPDIR"/patchrome-wait-*/stealth/daemon.log; do python3 .github/probe/slow-window.py "$log" | head -150 || true; done
            pkill -f "chrome-profile" || true
            sleep 2
            rm -rf "$TMPDIR"/patchrome-wait-* || true
          done
