name: Probe focus

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Probe focus (${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: |
          open -a TextEdit
          sleep 3
          .github/probe/front-log.sh > front.log &
          sleep 1
          PROBE_MARKS=$PWD/marks.log npx vitest run test/integration --config .github/probe/vitest.probe.config.ts --shard=${{ matrix.shard }}/3 > vitest.log 2>&1 || true
          grep -E "×|Tests " vitest.log || true
          grep -A40 "FAIL " vitest.log | head -120 || true
          sleep 2
          kill %1
          python3 .github/probe/summarize.py front.log marks.log
