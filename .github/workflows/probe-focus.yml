name: Probe focus

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Probe focus (${{ matrix.file }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        file: [sessions, hardening]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: |
          open -a TextEdit
          sleep 3
          .github/probe/front-log.sh > front.log &
          sleep 1
          npx vitest run test/integration/${{ matrix.file }}.test.ts || true
          sleep 2
          kill %1
          python3 .github/probe/summarize.py front.log
          cat front.log
